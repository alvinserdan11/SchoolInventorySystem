<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - School Inventory System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-hidden="true" tabindex="-1">
  <label for="menu-toggle" class="menu-backdrop"></label>
  <div class="dashboard-card">
    <aside>
      <label for="menu-toggle" class="sidebar-close" role="button" aria-label="Close menu">✖</label>
      <img src="logo.jpg" alt="logo">
      <h1>School Inventory System</h1>
      <nav class="sidebar-nav">
        <button type="button" class="nav-link" onclick="showPage('dashboard')">📊 <span>Dashboard</span></button>
        <button type="button" class="nav-link" onclick="showPage('equipment')">📦 <span>Equipment</span></button>
        <button type="button" class="nav-link active" onclick="showPage('users')">👥 <span>Users</span></button>
        <button type="button" class="nav-link" onclick="showPage('history')">📜 <span>Borrowing History</span></button>
        <button type="button" class="nav-link" onclick="showPage('penalties')">💰 <span>Penalties</span></button>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="nav-link" onclick="logout()">🚪 <span>Log Out</span></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar glass">
        <label for="menu-toggle" id="menu-button" class="menu-button" role="button" aria-label="Open menu">☰</label>
        <h2 id="page-title">User Management</h2>
        <div class="topbar-user">
          <span id="user-name">User</span>
          <span id="user-role" class="badge badge-active">Role</span>
        </div>
      </header>
      <div class="content">
        <section id="page-users" class="page">
          <div class="toolbar glass">
            <input type="search" id="users-search" placeholder="🔍 Search users..." oninput="renderUsers()">
            <select id="users-type-filter" onchange="renderUsers()">
              <option value="all">All Users</option>
              <option value="student">Students</option>
              <option value="teacher">Teachers</option>
              <option value="staff">Admin / Custodian</option>
            </select>
            <button type="button" class="btn btn-primary" onclick="openAddUser()">➕ Add User</button>
          </div>
          <section class="panel glass">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>User ID</th>
                    <th>Full Name</th>
                    <th>ID Number</th>
                    <th>Email</th>
                    <th>Contact</th>
                    <th>Department</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="users-body">
                  <tr>
                    <td colspan="9">Loading users...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </section>

      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <!-- Add/Edit User Modal -->
  <div id="user-form-modal" class="modal-overlay hidden" onclick="closeModalOnBackdrop(event, 'user-form-modal')">
    <div class="modal-box glass">
      <div class="modal-header">
        <h3 id="user-form-title">Add New User</h3>
        <button type="button" class="close-button" onclick="closeModal('user-form-modal')">✖</button>
      </div>
      <form id="user-form" class="form-grid" onsubmit="saveUser(event)">
        <input type="hidden" id="user-record-id">
        <div><label for="user-student-id">Student Number / Employee ID *</label><input type="text" id="user-student-id"
            required></div>
        <div><label for="user-first-name">First Name *</label><input type="text" id="user-first-name" required></div>
        <div><label for="user-middle-name">Middle Name</label><input type="text" id="user-middle-name"></div>
        <div><label for="user-last-name">Last Name *</label><input type="text" id="user-last-name" required></div>
        <div class="full-width"><label for="user-address">Address</label><input type="text" id="user-address"></div>
        <div><label for="user-email">Email Address *</label><input type="email" id="user-email" required></div>
        <div><label for="user-contact">Contact Number *</label><input type="text" id="user-contact" required></div>
        <div><label for="user-dob">Date of Birth</label><input type="date" id="user-dob"></div>
        <div><label for="user-department">Department / Grade Level *</label><input type="text" id="user-department"
            required></div>
        <div><label for="user-course">Course *</label><input type="text" id="user-course" required></div>
        <div><label for="user-type">User Type *</label>
          <select id="user-type" onchange="updateUserFormFields()" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="custodian">Custodian</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div><label for="user-role">Role</label>
          <select id="user-role">
            <option value="borrower">Borrower</option>
            <option value="operator">Operator</option>
          </select>
        </div>
        <div><label for="user-status">Account Status</label>
          <select id="user-status">
            <option>Active</option>
            <option>Inactive</option>
          </select>
        </div>
        <div id="user-password-group"><label for="user-password">Password (login accounts only)</label><input
            type="password" id="user-password" minlength="6"><small id="user-password-hint" class="hint-text"></small>
        </div>
        <div class="full-width modal-actions">
          <button type="button" class="btn" onclick="closeModal('user-form-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <!-- User History Modal -->
  <div id="user-history-modal" class="modal-overlay hidden" onclick="closeModalOnBackdrop(event, 'user-history-modal')">
    <div class="modal-box modal-wide glass">
      <div class="modal-header">
        <h3 id="user-history-title">Borrowing History</h3>
        <button type="button" class="close-button" onclick="closeModal('user-history-modal')">✖</button>
      </div>
      <div id="user-history-body"></div>
    </div>
  </div>

  <script src="./js/common.js"></script>
  <script src="./js/users.js"></script>
</body>

</html>
