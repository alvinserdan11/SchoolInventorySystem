<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - School Inventory System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-hidden="true" tabindex="-1">
  <label for="menu-toggle" class="menu-backdrop"></label>
  <div class="dashboard-card">
    <aside>
      <label for="menu-toggle" class="sidebar-close" role="button" aria-label="Close menu">✖</label>
      <img src="logo.jpg" alt="logo">
      <h1>School Inventory System</h1>
      <nav class="sidebar-nav">
        <button type="button" class="nav-link" onclick="showPage('dashboard')">📊 <span>Dashboard</span></button>
        <button type="button" class="nav-link" onclick="showPage('equipment')">📦 <span>Equipment</span></button>
        <button type="button" class="nav-link" onclick="showPage('users')">👥 <span>Users</span></button>
        <button type="button" class="nav-link" onclick="showPage('history')">📜 <span>Borrowing History</span></button>
        <button type="button" class="nav-link" onclick="showPage('penalties')">💰 <span>Penalties</span></button>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="nav-link" onclick="logout()">🚪 <span>Log Out</span></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar glass">
        <label for="menu-toggle" id="menu-button" class="menu-button" role="button" aria-label="Open menu">☰</label>
        <h2 id="page-title">User Management</h2>
        <div class="topbar-user">
          <span id="user-name">User</span>
          <span id="user-role" class="badge badge-active" style="cursor:pointer" onclick="openChangePassword()"
            title="Click to change password">Role</span>
        </div>
      </header>
      <div class="content">
        <section id="page-users" class="page">
          <div class="toolbar glass">
            <input type="search" id="users-search" placeholder="🔍 Search users..." oninput="renderUsers()">
            <select id="users-type-filter" onchange="renderUsers()">
              <option value="all">All Users</option>
              <option value="student">Students</option>
              <option value="teacher">Teachers</option>
              <option value="staff">Admin / Custodian</option>
            </select>
            <button type="button" class="btn btn-primary" onclick="openAddUser()">➕ Add User</button>
          </div>
          <section class="panel glass">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>User ID</th>
                    <th>Full Name</th>
                    <th>ID Number</th>
                    <th>Email</th>
                    <th>Contact</th>
                    <th>Department</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="users-body">
                  <tr>
                    <td colspan="9">Loading users...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </section>

      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <!-- Add/Edit User Modal -->
  <div id="user-form-modal" class="modal-overlay hidden" onclick="closeModalOnBackdrop(event, 'user-form-modal')">
    <div class="modal-box glass">
      <div class="modal-header">
        <h3 id="user-form-title">Add New User</h3>
        <button type="button" class="close-button" onclick="closeModal('user-form-modal')">✖</button>
      </div>
      <form id="user-form" class="form-grid" onsubmit="saveUser(event)">
        <input type="hidden" id="user-record-id">
        <div><label for="user-student-id">Student Number / Employee ID *</label><input type="text" id="user-student-id"
            required></div>
        <div><label for="user-first-name">First Name *</label><input type="text" id="user-first-name" required></div>
        <div><label for="user-middle-name">Middle Name</label><input type="text" id="user-middle-name"></div>
        <div><label for="user-last-name">Last Name *</label><input type="text" id="user-last-name" required></div>
        <div class="full-width"><label for="user-address">Address</label><input type="text" id="user-address"></div>
        <div><label for="user-email">Email Address *</label><input type="email" id="user-email" required></div>
        <div><label for="user-contact">Contact Number *</label><input type="text" id="user-contact" required></div>
        <div><label for="user-dob">Date of Birth</label><input type="date" id="user-dob"></div>
        <div>
          <label for="user-department">Department / Grade Level *</label>
          <select id="user-department" required>
            <option value="">-- Select Department / Grade --</option>
            <optgroup label="Colleges">
              <option value="College of Business Administration">College of Business Administration</option>
              <option value="College of Criminal Justice Education">College of Criminal Justice Education</option>
              <option value="College of Education">College of Education</option>
              <option value="College of Engineering">College of Engineering</option>
              <option value="College of Hospitality Management">College of Hospitality Management</option>
              <option value="College of Human Kinetics">College of Human Kinetics</option>
              <option value="College of ICT">College of Information and Communications Technology</option>
              <option value="College of Nursing">College of Nursing</option>
              <option value="Custodian">Custodian</option>
              <option value="Admin">Admin</option>
            </optgroup>
            <optgroup label="Senior High School">
              <option value="Grade 11">Grade 11</option>
              <option value="Grade 12">Grade 12</option>
            </optgroup>
          </select>
        </div>
        <div>
          <label for="user-course">Course *</label>
          <select id="user-course" required>
            <option value="">-- Select Course / Strand --</option>
            <optgroup label="Business Administration">
              <option value="BSBA">BS Business Administration</option>
              <option value="BSA">BS Accountancy</option>
            </optgroup>
            <optgroup label="Criminal Justice Education">
              <option value="BSCrim">BS Criminology</option>
            </optgroup>
            <optgroup label="Education">
              <option value="BEED">BEEd - Elementary Education</option>
              <option value="BSED">BSEd - Secondary Education</option>
              <option value="BSED">BSNEd - Bachelor of Special Needs Education</option>
            </optgroup>
            <optgroup label="Engineering">
              <option value="BSCE">BS Geodetic Engineering</option>
              <option value="BSCpE">BS Computer Engineering</option>
            </optgroup>
            <optgroup label="Hospitality Management">
              <option value="BSHM">BS Hospitality Management</option>
              <option value="BSTM">BS Tourism Management</option>
            </optgroup>
            <optgroup label="Human Kinetics">
              <option value="BSPE">BS Physical Education</option>
            </optgroup>
            <optgroup label="Information Technology">
              <option value="BSIT">BS Information Technology</option>
              <option value="BSCS">BS Computer Science</option>
            </optgroup>
            <optgroup label="Nursing">
              <option value="BSN">BS Nursing</option>
            </optgroup>
            <optgroup label="Senior High School">
              <option value="STEM">STEM</option>
              <option value="ABM">ABM</option>
              <option value="HUMSS">HUMSS</option>
              <option value="GAS">GAS</option>
              <option value="TVL">TVL</option>
            </optgroup>
            <optgroup label="Administration">
              <option value="Admin">Administrator</option>
              <option value="Custodian">Custodian</option>
            </optgroup>
          </select>
        </div>
        <div><label for="user-type">User Type *</label>
          <select id="user-type" onchange="updateUserFormFields()" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="custodian">Custodian</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div><label for="user-role">Role</label>
          <select id="user-role">
            <option value="borrower">Borrower</option>
            <option value="operator">Operator</option>
          </select>
        </div>
        <div><label for="user-status">Account Status</label>
          <select id="user-status">
            <option>Active</option>
            <option>Inactive</option>
          </select>
        </div>

        <div id="user-password-group"><label for="user-password">Password (login accounts only)</label><input
            type="password" id="user-password" minlength="6"><small id="user-password-hint" class="hint-text"></small>
        </div>
        <div class="full-width modal-actions">
          <button type="button" class="btn" onclick="closeModal('user-form-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save User</button>
        </div>
      </form>
    </div>
  </div>

  <!-- User History Modal -->
  <div id="user-history-modal" class="modal-overlay hidden" onclick="closeModalOnBackdrop(event, 'user-history-modal')">
    <div class="modal-box modal-wide glass">
      <div class="modal-header">
        <h3 id="user-history-title">Borrowing History</h3>
        <button type="button" class="close-button" onclick="closeModal('user-history-modal')">✖</button>
      </div>
      <div id="user-history-body"></div>
    </div>
  </div>

  <!-- Change Password Modal -->
  <div id="change-password-modal" class="modal-overlay hidden"
    onclick="closeModalOnBackdrop(event, 'change-password-modal')">
    <div class="modal-box glass" style="max-width:420px">
      <div class="modal-header">
        <h3>Change Password</h3>
        <button type="button" class="close-button" onclick="closeModal('change-password-modal')">✖</button>
      </div>
      <form id="change-password-form" class="form-grid" onsubmit="changePassword(event)"
        style="grid-template-columns:1fr">

        <!-- Current Password -->
        <div>
          <label for="current-password">Current Password *</label>
          <div class="password-wrapper">
            <input type="password" id="current-password" required>
            <button type="button" class="toggle-password-btn" onclick="togglePassword('current-password', this)"
              title="Show password">
              <svg class="eye-open" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-slash" viewBox="0 0 24 24" style="display:none;">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.57m-3.23 3.23L3.42 3.42">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- New Password -->
        <div>
          <label for="new-password">New Password *</label>
          <div class="password-wrapper">
            <input type="password" id="new-password" minlength="6" required>
            <button type="button" class="toggle-password-btn" onclick="togglePassword('new-password', this)"
              title="Show password">
              <svg class="eye-open" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-slash" viewBox="0 0 24 24" style="display:none;">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.57m-3.23 3.23L3.42 3.42">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
          <small class="hint-text">Minimum 6 characters</small>
        </div>

        <!-- Confirm New Password -->
        <div>
          <label for="confirm-password">Confirm New Password *</label>
          <div class="password-wrapper">
            <input type="password" id="confirm-password" minlength="6" required>
            <button type="button" class="toggle-password-btn" onclick="togglePassword('confirm-password', this)"
              title="Show password">
              <svg class="eye-open" viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg class="eye-slash" viewBox="0 0 24 24" style="display:none;">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.57m-3.23 3.23L3.42 3.42">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <div class="modal-actions" style="margin-top:10px">
          <button type="button" class="btn" onclick="closeModal('change-password-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Update Password</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./js/common.js"></script>
  <script src="./js/users.js"></script>
</body>

</html>
