<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - School Inventory System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        position: relative;
        background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    }

    .login-card {
        width: 380px;
        padding: 40px 35px;
        text-align: center;
        background: rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 25px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        position: relative;
        z-index: 2;
    }

    .login-card img {
        width: 90px;
        height: 90px;
        object-fit: contain;
        margin-bottom: 15px;
        border-radius: 50%;
    }

    .login-card h1 {
        color: white;
        font-size: 20px;
        font-weight: 600;
    }

    .subtitle {
        color: rgba(255, 255, 255, 0.75);
        font-size: 13px;
        margin-bottom: 10px;
    }

    .admin-only {
        display: inline-block;
        padding: 5px 15px;
        margin-bottom: 25px;
        color: #fff;
        background: rgba(0, 212, 255, 0.2);
        border: 1px solid rgba(0, 212, 255, 0.5);
        border-radius: 20px;
        font-size: 11px;
        letter-spacing: 2px;
    }

    .label-container {
        text-align: left;
        margin-bottom: 20px;
    }

    .label-container label {
        display: block;
        color: white;
        font-size: 13px;
        margin-bottom: 8px;
    }

    .label-container input {
        width: 100%;
        padding: 13px 15px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 10px;
        outline: none;
        background: rgba(255, 255, 255, 0.1);
        color: white;
        font-size: 13px;
        transition: 0.3s;
    }

    .label-container input::placeholder {
        color: rgba(255, 255, 255, 0.55);
    }

    .label-container input:focus {
        border-color: #00d4ff;
        box-shadow: 0 0 12px rgba(0, 212, 255, 0.4);
    }

    button[type="submit"] {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(90deg, #00d4ff, #0072ff);
        color: white;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 2px;
        cursor: pointer;
        transition: 0.3s;
    }

    button[type="submit"]:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(0, 212, 255, 0.4);
    }

    .admin-acc {
        margin-top: 25px;
        padding: 12px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
    }

    .admin-acc p {
        color: rgba(255, 255, 255, 0.7);
        font-size: 11px;
    }

    .admin-acc span {
        color: #00d4ff;
        font-size: 13px;
        font-weight: 600;
    }

    .bubbles {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        top: 0;
        left: 0;
        z-index: 1;
    }

    .bubbles span {
        position: absolute;
        bottom: -100px;
        width: 40px;
        height: 40px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 50%;
        animation: bubble 12s linear infinite;
    }

    .bubbles span:nth-child(1) {
        left: 10%;
        width: 60px;
        height: 60px;
        animation-duration: 10s;
    }

    .bubbles span:nth-child(2) {
        left: 20%;
        width: 25px;
        height: 25px;
        animation-duration: 7s;
        animation-delay: 2s;
    }

    .bubbles span:nth-child(3) {
        left: 35%;
        width: 80px;
        height: 80px;
        animation-duration: 15s;
        animation-delay: 1s;
    }

    .bubbles span:nth-child(4) {
        left: 50%;
        width: 35px;
        height: 35px;
        animation-duration: 9s;
        animation-delay: 3s;
    }

    .bubbles span:nth-child(5) {
        left: 65%;
        width: 55px;
        height: 55px;
        animation-duration: 12s;
        animation-delay: 2s;
    }

    .bubbles span:nth-child(6) {
        left: 80%;
        width: 30px;
        height: 30px;
        animation-duration: 8s;
    }

    .bubbles span:nth-child(7) {
        left: 90%;
        width: 75px;
        height: 75px;
        animation-duration: 14s;
        animation-delay: 4s;
    }

    .bubbles span:nth-child(8) {
        left: 5%;
        width: 35px;
        height: 35px;
        animation-duration: 11s;
        animation-delay: 5s;
    }

    .bubbles span:nth-child(9) {
        left: 45%;
        width: 20px;
        height: 20px;
        animation-duration: 7s;
        animation-delay: 4s;
    }

    .bubbles span:nth-child(10) {
        left: 75%;
        width: 45px;
        height: 45px;
        animation-duration: 13s;
        animation-delay: 1s;
    }

    @keyframes bubble {
        0% {
            transform: translateY(0) scale(1);
            opacity: 0;
        }

        20% {
            opacity: 0.7;
        }

        80% {
            opacity: 0.7;
        }

        100% {
            transform: translateY(-110vh) scale(1.5);
            opacity: 0;
        }
    }

    @media (max-width: 450px) {
        .login-card {
            width: 90%;
            padding: 30px 25px;
        }
    }
</style>

<body>
    <div class="bubbles">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="login-card">
        <img src="logo.jpg" alt="logo">
        <h1>Hi! Welcome</h1>
        <p class="subtitle">Please Sign in to continue</p>
        <p class="admin-only">Admin only</p>
        <form id="login-form">
            <div class="label-container">
                <label for="username">Username:</label>
                <input type="text" required id="username" name="username">
            </div>
            <div class="label-container">
                <label for="password">Password:</label>
                <input type="password" required id="password" name="password">
            </div>
            <button type="submit">Login</button>
    </div>
    </form>
    </div>
    <script src="./js/common.js"></script>
    <script src="./js/login.js"></script>
</body>

</html>
