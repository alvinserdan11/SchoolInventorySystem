<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penalty Management - School Inventory System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-hidden="true" tabindex="-1">
  <label for="menu-toggle" class="menu-backdrop"></label>
  <div class="dashboard-card">
    <aside>
      <label for="menu-toggle" class="sidebar-close" role="button" aria-label="Close menu">✖</label>
      <img src="logo.jpg" alt="logo">
      <h1>School Inventory System</h1>
      <nav class="sidebar-nav">
        <button type="button" class="nav-link" onclick="showPage('dashboard')">📊 <span>Dashboard</span></button>
        <button type="button" class="nav-link" onclick="showPage('equipment')">📦 <span>Equipment</span></button>
        <button type="button" class="nav-link" onclick="showPage('users')">👥 <span>Users</span></button>
        <button type="button" class="nav-link" onclick="showPage('history')">📜 <span>Borrowing History</span></button>
        <button type="button" class="nav-link" onclick="showPage('penalties')">💰 <span>Penalties</span></button>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="nav-link" onclick="logout()">🚪 <span>Log Out</span></button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar glass">
        <label for="menu-toggle" id="menu-button" class="menu-button" role="button" aria-label="Open menu">☰</label>
        <h2 id="page-title">Penalty Management</h2>
        <div class="topbar-user">
          <span id="user-name">User</span>
          <span id="user-role" class="badge badge-active">Role</span>
        </div>
      </header>
      <div class="content">
        <section id="page-penalties" class="page">
          <div class="toolbar glass">
            <input type="search" id="penalties-search" placeholder="🔍 Search penalties..." oninput="renderPenalties()">
            <select id="penalties-status-filter" onchange="renderPenalties()">
              <option value="all">All Statuses</option>
              <option value="Pending">Pending</option>
              <option value="Paid">Paid</option>
              <option value="Waived">Waived</option>
            </select>
            <button type="button" class="btn btn-primary" onclick="openAddPenalty()">➕ Record Penalty</button>
          </div>
          <section class="panel glass">
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Borrower</th>
                    <th>Reason</th>
                    <th>Amount Due</th>
                    <th>Date Notified</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="penalties-body">
                  <tr>
                    <td colspan="6">Loading penalties...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>
        </section>

      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>

  <!-- Add Penalty Modal -->
  <div id="penalty-form-modal" class="modal-overlay hidden" onclick="closeModalOnBackdrop(event, 'penalty-form-modal')">
    <div class="modal-box glass">
      <div class="modal-header">
        <h3>Record New Penalty</h3>
        <button type="button" class="close-button" onclick="closeModal('penalty-form-modal')">✖</button>
      </div>
      <form id="penalty-form" class="form-grid" onsubmit="savePenalty(event)">
        <div><label for="penalty-user">Borrower</label><select id="penalty-user" required></select></div>
        <div><label for="penalty-transaction">Related Transaction (Optional)</label><select
            id="penalty-transaction"></select></div>
        <div><label for="penalty-amount">Amount Due (PHP)</label><input type="number" id="penalty-amount" min="0"
            step="0.01" required></div>
        <div class="full-width"><label for="penalty-reason">Reason</label><select id="penalty-reason" required>
            <option value="">Select Reason</option>
            <option value="Late return">Late return</option>
            <option value="Damaged equipment">Damaged equipment</option>
          </select></div>
        <div class="full-width modal-actions">
          <button type="button" class="btn" onclick="closeModal('penalty-form-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Penalty</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./js/common.js"></script>
  <script src="./js/penalties.js"></script>
</body>

</html>
